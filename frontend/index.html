<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threat Intelligence Dashboard</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-900 text-gray-100">
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <header class="mb-8">
            <h1 class="text-4xl font-bold text-blue-400 mb-2">Threat Intelligence Pipeline</h1>
            <p class="text-gray-400">Real-time threat indicator analysis and visualization</p>
        </header>

        <!-- Statistics Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-gray-800 rounded-lg p-4 border border-gray-700">
                <h3 class="text-sm text-gray-400 mb-1">Total Documents</h3>
                <p class="text-2xl font-bold text-blue-400" id="stat-documents">0</p>
            </div>
            <div class="bg-gray-800 rounded-lg p-4 border border-gray-700">
                <h3 class="text-sm text-gray-400 mb-1">Total Indicators</h3>
                <p class="text-2xl font-bold text-green-400" id="stat-indicators">0</p>
            </div>
            <div class="bg-gray-800 rounded-lg p-4 border border-gray-700">
                <h3 class="text-sm text-gray-400 mb-1">Active Campaigns</h3>
                <p class="text-2xl font-bold text-yellow-400" id="stat-campaigns">0</p>
            </div>
            <div class="bg-gray-800 rounded-lg p-4 border border-gray-700">
                <h3 class="text-sm text-gray-400 mb-1">Threat Actors</h3>
                <p class="text-2xl font-bold text-red-400" id="stat-actors">0</p>
            </div>
        </div>

        <!-- Search Section -->
        <div class="bg-gray-800 rounded-lg p-6 mb-8 border border-gray-700">
            <h2 class="text-xl font-semibold mb-4 text-blue-300">Search Intelligence</h2>
            <div class="flex gap-4 mb-4">
                <input 
                    type="text" 
                    id="search-input" 
                    placeholder="Enter search query or indicator..."
                    class="flex-1 px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:border-blue-400 text-white"
                >
                <select id="search-type" class="px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white">
                    <option value="hybrid">Hybrid Search</option>
                    <option value="semantic">Semantic</option>
                    <option value="indicator">Indicator</option>
                    <option value="graph">Graph</option>
                </select>
                <button 
                    onclick="performSearch()" 
                    class="px-6 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg font-semibold transition-colors"
                >
                    Search
                </button>
            </div>
            <div id="search-results" class="mt-4 space-y-2"></div>
        </div>

        <!-- Network Visualization -->
        <div class="bg-gray-800 rounded-lg p-6 mb-8 border border-gray-700">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold text-blue-300">Network Graph</h2>
                <div class="flex gap-2">
                    <input 
                        type="text" 
                        id="node-input" 
                        placeholder="Enter node ID..."
                        class="px-3 py-1 bg-gray-700 border border-gray-600 rounded text-sm text-white"
                    >
                    <button 
                        onclick="loadNetworkGraph()" 
                        class="px-4 py-1 bg-green-600 hover:bg-green-700 rounded text-sm font-semibold transition-colors"
                    >
                        Load Graph
                    </button>
                </div>
            </div>
            <div id="network-graph" class="bg-gray-900 rounded-lg" style="height: 500px;"></div>
        </div>

        <!-- Indicator Types Distribution -->
        <div class="bg-gray-800 rounded-lg p-6 mb-8 border border-gray-700">
            <h2 class="text-xl font-semibold mb-4 text-blue-300">Indicator Distribution</h2>
            <div id="indicator-chart" style="height: 300px;"></div>
        </div>

        <!-- Recent Activity -->
        <div class="bg-gray-800 rounded-lg p-6 border border-gray-700">
            <h2 class="text-xl font-semibold mb-4 text-blue-300">Recent Activity</h2>
            <div id="activity-feed" class="space-y-2">
                <div class="flex items-center justify-between py-2 border-b border-gray-700">
                    <span class="text-sm text-gray-400">Loading recent activity...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for indicator details -->
    <div id="indicator-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-gray-800 rounded-lg p-6 max-w-2xl w-full mx-4 max-h-[80vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-semibold text-blue-300">Indicator Details</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <div id="modal-content" class="text-gray-300"></div>
        </div>
    </div>

    <script src="network_viz.js"></script>
    <script>
        const API_URL = 'http://localhost:8000';

        // Initialize dashboard
        document.addEventListener('DOMContentLoaded', function() {
            loadStatistics();
            initializeNetworkGraph();
            loadIndicatorDistribution();
            loadRecentActivity();
            
            // Refresh statistics every 30 seconds
            setInterval(loadStatistics, 30000);
        });

        async function loadStatistics() {
            try {
                const response = await fetch(`${API_URL}/statistics`);
                const data = await response.json();
                
                document.getElementById('stat-documents').textContent = 
                    data.relational_database?.total_documents || 0;
                document.getElementById('stat-indicators').textContent = 
                    data.graph_database?.indicators || 0;
                document.getElementById('stat-campaigns').textContent = 
                    data.graph_database?.campaigns || 0;
                document.getElementById('stat-actors').textContent = 
                    data.graph_database?.threat_actors || 0;
            } catch (error) {
                console.error('Error loading statistics:', error);
            }
        }

        async function performSearch() {
            const query = document.getElementById('search-input').value;
            const searchType = document.getElementById('search-type').value;
            
            if (!query) return;
            
            const resultsDiv = document.getElementById('search-results');
            resultsDiv.innerHTML = '<div class="text-gray-400">Searching...</div>';
            
            try {
                const response = await fetch(`${API_URL}/search`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        query: query,
                        search_type: searchType,
                        limit: 10
                    })
                });
                
                const data = await response.json();
                displaySearchResults(data.results);
            } catch (error) {
                resultsDiv.innerHTML = `<div class="text-red-400">Error: ${error.message}</div>`;
            }
        }

        function displaySearchResults(results) {
            const resultsDiv = document.getElementById('search-results');
            
            if (!results || results.length === 0) {
                resultsDiv.innerHTML = '<div class="text-gray-400">No results found</div>';
                return;
            }
            
            resultsDiv.innerHTML = results.map(result => `
                <div class="p-3 bg-gray-700 rounded border border-gray-600 hover:border-blue-400 transition-colors cursor-pointer" 
                     onclick='showIndicatorDetails(${JSON.stringify(result)})'>
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <span class="text-xs text-blue-400 font-semibold">${result.type}</span>
                            <p class="text-sm mt-1">${result.content}</p>
                        </div>
                        <span class="text-xs text-gray-400">Score: ${(result.score * 100).toFixed(1)}%</span>
                    </div>
                </div>
            `).join('');
        }

        function showIndicatorDetails(indicator) {
            const modal = document.getElementById('indicator-modal');
            const content = document.getElementById('modal-content');
            
            content.innerHTML = `
                <div class="space-y-4">
                    <div>
                        <label class="text-xs text-gray-400">Type</label>
                        <p class="text-lg font-semibold text-blue-400">${indicator.type}</p>
                    </div>
                    <div>
                        <label class="text-xs text-gray-400">Content</label>
                        <p class="font-mono bg-gray-900 p-2 rounded">${indicator.content}</p>
                    </div>
                    <div>
                        <label class="text-xs text-gray-400">Confidence Score</label>
                        <p class="text-lg">${(indicator.score * 100).toFixed(2)}%</p>
                    </div>
                    ${indicator.metadata ? `
                    <div>
                        <label class="text-xs text-gray-400">Metadata</label>
                        <pre class="text-xs bg-gray-900 p-2 rounded overflow-x-auto">${JSON.stringify(indicator.metadata, null, 2)}</pre>
                    </div>
                    ` : ''}
                </div>
            `;
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            const modal = document.getElementById('indicator-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        async function loadRecentActivity() {
            // This would load recent activity from the API
            const activityDiv = document.getElementById('activity-feed');
            activityDiv.innerHTML = `
                <div class="py-2 border-b border-gray-700">
                    <span class="text-xs text-gray-500">2 minutes ago</span>
                    <p class="text-sm">New indicator extracted: malicious-domain.com</p>
                </div>
                <div class="py-2 border-b border-gray-700">
                    <span class="text-xs text-gray-500">5 minutes ago</span>
                    <p class="text-sm">Document processed: Operation_Overload.pdf</p>
                </div>
                <div class="py-2 border-b border-gray-700">
                    <span class="text-xs text-gray-500">12 minutes ago</span>
                    <p class="text-sm">Campaign updated: Doppelgänger</p>
                </div>
            `;
        }

        // Enter key search
        document.getElementById('search-input')?.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') performSearch();
        });
    </script>
</body>
</html>
